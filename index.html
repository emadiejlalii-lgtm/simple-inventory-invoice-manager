<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Inventory & Invoice Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Inventory & Invoice Manager</h1>
    <p>A simple starter dashboard for products, customers and sales.</p>
    <section class="cards">
      <div class="card"><strong id="products">0</strong><span>Products</span></div>
      <div class="card"><strong id="customers">0</strong><span>Customers</span></div>
      <div class="card"><strong id="invoices">0</strong><span>Invoices</span></div>
    </section>
    <button id="add">Add sample data</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
